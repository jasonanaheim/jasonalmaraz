<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jason Almaraz's portfolio. Work, about, resume, and contact.">
  <title>Jason Almaraz</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-padding-top: 24px; }
    body { margin: 0; background: #fff; color: #222; font-family: system-ui, sans-serif; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    .wrap { width: min(100% - 48px, 1080px); margin-inline: auto; }
    header { border-bottom: 1px solid #e8e8e8; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 26px; }
    .name { font-weight: 600; white-space: nowrap; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 28px; font-size: 14px; }
    .intro { padding-block: 96px; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 7vw, 56px); font-weight: 500; letter-spacing: -.04em; line-height: 1.15; }
    p { margin: 0; color: #666; }
    section { padding-block: 40px; border-top: 1px solid #e8e8e8; }
    h2 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
    footer { padding-block: 40px; color: #777; font-size: 13px; }
    .skip { position: absolute; top: -100px; left: 24px; padding: 8px 16px; background: white; }
    .skip:focus { top: 8px; }
    @media (max-width: 600px) {
      .header-inner { align-items: flex-start; flex-direction: column; gap: 16px; }
      nav { gap: 12px 24px; }
      .intro { padding-block: 64px; }
    }
  </style>
</head>
<body id="top">
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="wrap header-inner">
      <a class="name" href="#top">Jason Almaraz</a>
      <nav aria-label="Main navigation">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#resume">Resume <span aria-hidden="true">↗</span></a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">
    <div class="intro">
      <h1>Jason Almaraz</h1>
      <p>Portfolio in progress.</p>
    </div>
    <section id="work" aria-labelledby="work-title">
      <h2 id="work-title">Work</h2>
      <p>Projects coming soon.</p>
    </section>
    <section id="about" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <p>More about me coming soon.</p>
    </section>
    <section id="resume" aria-labelledby="resume-title">
      <h2 id="resume-title">Resume</h2>
      <p>Resume coming soon.</p>
    </section>
    <section id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Contact</h2>
      <p>Contact details coming soon.</p>
    </section>
  </main>
  <footer class="wrap">Jason Almaraz</footer>
</body>
</html>
